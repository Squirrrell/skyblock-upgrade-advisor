<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All-in-one Hypixel SkyBlock site: full profile stats, networth, missing accessories and fortune upgrades, plus live bazaar, auction prices, mayor and event calendar." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>SkyBlock Advisor</title>
    <meta name="theme-color" content="#2b2b2b" />
    <script>
      // Set the theme before first paint so there is no flash.
      try {
        const saved = localStorage.getItem('theme');
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
